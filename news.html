    .news-grid {

    .news-card {
      padding: 25px;
      border-radius: 20px;

      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);

    .news-card:hover {

      border-color: rgba(155,108,255,.3);

    .news-tag {

    .news-card p {

    .news-date {

    .empty-news {
      min-height: 330px;

      border-radius: 25px;

      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.08);

      position: relative;
      overflow: hidden;
    }

    .empty-news::before {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      background: #8257ff;
      filter: blur(90px);
      opacity: .08;

      top: -70px;
      right: -70px;
    }

    .empty-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    .empty-news h3 {

      margin-bottom: 10px;
    }

    .empty-news p {
      color: #858b9b;
      line-height: 2;
      max-width: 550px;
      margin: auto;
    }

    .empty-code {
      margin-top: 18px;

      display: inline-block;

      padding: 7px 12px;
      border-radius: 8px;

      background: #05060a;
      border: 1px solid rgba(255,255,255,.08);

      color: #9b6cff;

      font-family: "Share Tech Mono", monospace;
      font-size: 12px;
    }

    .loading-news {
      min-height: 330px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

    .error-news {

    footer {

<div id="newsContainer">

  </footer>  <!-- =========================
       SUPABASE CONNECTION
  ========================= -->  <script>

    const SUPABASE_URL = "https://deiaynhcldaxbybctphg.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_EKRrwk5g0__d8GdCwERvtQ_Qgy1Lh0f";


    async function loadNews() {

      const container =
        document.getElementById("newsContainer");

      const databaseStatus =
        document.getElementById("databaseStatus");


      try {

        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/news?select=*&order=created_at.desc`,
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`
            }
          }
        );


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const news =
          await response.json();


        databaseStatus.textContent =
          "CONNECTED";

        databaseStatus.style.color =
          "#78e88b";


        if (!news || news.length === 0) {

          container.innerHTML = `

            <div class="empty-news">

              <div>

                <div class="empty-icon">
                  📰
                </div>

                <h3>
                  هنوز خبری منتشر نشده است
                </h3>

                <p>
                  در حال حاضر اطلاعات خبری
                  قابل نمایش برای این سایت
                  در اختیار سیستم قرار نگرفته است.
                </p>

                <div class="empty-code">
                  NEWS_DATABASE: EMPTY
                </div>

              </div>

            </div>

          `;

          return;

        }


        container.innerHTML = `

          <div class="news-grid">

            ${news.map(item => `

              <article class="news-card">

                <span class="news-tag">
                  AMIR AMAZING GAME
                </span>

                <h3>
                  ${escapeHTML(item.title)}
                </h3>

                <p>
                  ${escapeHTML(item.content)}
                </p>

                <span class="news-date">
                  ${formatDate(item.created_at)}
                </span>

              </article>

            `).join("")}

          </div>

        `;


      } catch (error) {

        console.error(
          "NEWS DATABASE ERROR:",
          error
        );


        databaseStatus.textContent =
          "ERROR";

        databaseStatus.style.color =
          "#ff6b81";


        container.innerHTML = `

          <div class="error-news">

            <div>

              <div style="font-size:50px;">
                ⚠️
              </div>

              <h3 style="margin-top:15px;">
                خطا در اتصال به پایگاه داده
              </h3>

              <p style="margin-top:10px;color:#888;">
                اتصال به سیستم اخبار برقرار نشد.
              </p>

            </div>

          </div>

        `;

      }

    }


    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function formatDate(dateValue) {

      if (!dateValue) {
        return "DATE UNKNOWN";
      }

      const date =
        new Date(dateValue);

      if (Number.isNaN(date.getTime())) {
        return "DATE UNKNOWN";
      }

      return date.toLocaleDateString(
        "fa-IR",
        {
          year: "numeric",
          month: "long",
          day: "numeric"
        }
      );

    }


    loadNews();

    </script>
