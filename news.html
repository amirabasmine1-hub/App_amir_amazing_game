<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>اخبار | AMIR_AMAZING_GAME</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(125, 70, 255, 0.18), transparent 35%),
        linear-gradient(135deg, #090612, #12091f 55%, #08050d);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 35px 35px;
      mask-image: linear-gradient(to bottom, black, transparent);
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;

      width: 100%;
      padding: 18px 7%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      background: rgba(8, 5, 14, 0.82);
      backdrop-filter: blur(15px);

      border-bottom: 1px solid rgba(170, 90, 255, 0.2);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    }

    .logo {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
    }

    .logo span {
      color: #a970ff;
      text-shadow: 0 0 15px rgba(169, 112, 255, 0.55);
    }

    nav a {
      color: #ddd;
      text-decoration: none;
      margin-right: 18px;
      font-size: 14px;
      transition: 0.25s;
    }

    nav a:hover {
      color: #b77cff;
      text-shadow: 0 0 12px rgba(183, 124, 255, 0.5);
    }

    .hero {
      width: min(1100px, 90%);
      margin: 70px auto 30px;
      text-align: center;
    }

    .hero-badge {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 999px;

      background: rgba(155, 89, 255, 0.1);
      border: 1px solid rgba(155, 89, 255, 0.3);

      color: #bd8cff;
      font-size: 12px;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: clamp(32px, 6vw, 58px);
      margin-bottom: 14px;

      background: linear-gradient(90deg, #fff, #b87cff, #8f5cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: #aaa;
      font-size: 15px;
      line-height: 2;
    }

    .news-container {
      width: min(1000px, 90%);
      margin: 45px auto 80px;
      display: grid;
      gap: 22px;
    }

    .news-card {
      position: relative;
      overflow: hidden;

      background: rgba(19, 12, 32, 0.82);
      border: 1px solid rgba(164, 99, 255, 0.18);
      border-radius: 20px;

      padding: 25px;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.25),
        inset 0 1px rgba(255,255,255,0.03);

      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .news-card::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 4px;
      height: 100%;

      background: linear-gradient(#9a5cff, #c18aff);
      box-shadow: 0 0 20px rgba(154, 92, 255, 0.45);
    }

    .news-card:hover {
      transform: translateY(-4px);
      border-color: rgba(177, 111, 255, 0.4);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.35),
        0 0 30px rgba(131, 65, 255, 0.08);
    }

    .news-title {
      font-size: 21px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 12px;
    }

    .news-date {
      display: inline-block;
      color: #9f82c7;
      font-size: 12px;
      margin-bottom: 18px;
    }

    .news-content {
      color: #c7c1d1;
      line-height: 2;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 45px 20px;
      border-radius: 20px;

      background: rgba(19, 12, 32, 0.7);
      border: 1px solid rgba(164, 99, 255, 0.15);

      color: #aaa;
    }

    .loading {
      color: #b98aff;
    }

    .error {
      color: #ff8f9d;
    }

    footer {
      text-align: center;
      padding: 30px 15px;

      color: #777;
      font-size: 12px;

      border-top: 1px solid rgba(164, 99, 255, 0.12);
      background: rgba(5, 3, 9, 0.6);
    }

    /* =========================
       PANEL LOGIN MODAL
    ========================= */

    #panelLoginModal {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(10px);
    }

    .login-box {
      width: min(400px, 100%);

      padding: 30px;

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(30, 17, 50, 0.98),
          rgba(12, 7, 20, 0.98)
        );

      border: 1px solid rgba(173, 105, 255, 0.3);

      box-shadow:
        0 30px 100px rgba(0,0,0,0.65),
        0 0 45px rgba(133, 67, 255, 0.12);
    }

    .login-icon {
      width: 58px;
      height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 0 auto 18px;

      border-radius: 18px;

      background: rgba(151, 85, 255, 0.12);
      border: 1px solid rgba(151, 85, 255, 0.25);

      font-size: 26px;
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 8px;
    }

    .login-box p {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-bottom: 22px;
    }

    #panelPasswordInput {
      width: 100%;

      padding: 14px 16px;

      border-radius: 13px;
      border: 1px solid rgba(170, 100, 255, 0.25);

      background: rgba(0,0,0,0.3);
      color: #fff;

      outline: none;
      font-size: 14px;

      transition: 0.2s;
    }

    #panelPasswordInput:focus {
      border-color: #a66aff;
      box-shadow: 0 0 0 3px rgba(166, 106, 255, 0.08);
    }

    .login-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .login-buttons button {
      flex: 1;

      border: 0;
      border-radius: 12px;

      padding: 13px;

      cursor: pointer;
      font-family: inherit;
      font-weight: 700;

      transition: 0.2s;
    }

    .login-btn {
      background: linear-gradient(135deg, #8b4dff, #b36dff);
      color: white;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(145, 74, 255, 0.25);
    }

    .cancel-btn {
      background: rgba(255,255,255,0.06);
      color: #bbb;
      border: 1px solid rgba(255,255,255,0.08) !important;
    }

    .cancel-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    #panelLoginError {
      display: none;

      margin-top: 13px;
      padding: 10px;

      border-radius: 10px;

      text-align: center;

      color: #ff9ca7;
      background: rgba(255, 75, 100, 0.08);
      border: 1px solid rgba(255, 75, 100, 0.15);

      font-size: 12px;
    }

    @media (max-width: 700px) {
      nav {
        padding: 16px 5%;
      }

      .logo {
        font-size: 16px;
      }

      nav a {
        margin-right: 8px;
        font-size: 12px;
      }

      .hero {
        margin-top: 45px;
      }

      .news-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       NAVIGATION
  ========================== -->

  <nav>
    <div class="logo">
      AMIR <span>AMAZING</span> GAME
    </div>

    <div>
      <a href="index.html">🏠 خانه</a>
      <a href="news.html">📰 اخبار</a>

      <!-- مهم:
           این لینک مستقیماً panel.html را باز نمی‌کند.
           ابتدا رمز می‌خواهد. -->
      <a href="#" onclick="openPanelLogin(event)">🖥️ پنل</a>
    </div>
  </nav>


  <!-- =========================
       HERO
  ========================== -->

  <section class="hero">
    <div class="hero-badge">📡 مرکز اخبار</div>

    <h1>اخبار AMIR_AMAZING_GAME</h1>

    <p>
      آخرین اخبار، اطلاعیه‌ها و اتفاقات مربوط به گروه امازینگ
    </p>
  </section>


  <!-- =========================
       NEWS
  ========================== -->

  <main class="news-container" id="newsContainer">

    <div class="loading">
      ⏳ در حال دریافت اخبار...
    </div>

  </main>


  <!-- =========================
       PANEL LOGIN MODAL
  ========================== -->

  <div id="panelLoginModal">

    <div class="login-box">

      <div class="login-icon">
        🔐
      </div>

      <h2>ورود به پنل</h2>

      <p>
        برای ورود به پنل مدیریت، رمز عبور را وارد کنید.
      </p>

      <input
        id="panelPasswordInput"
        type="password"
        placeholder="رمز عبور پنل"
        autocomplete="off"
      >

      <div id="panelLoginError">
        ❌ رمز عبور اشتباه است.
      </div>

      <div class="login-buttons">

        <button
          class="login-btn"
          onclick="checkPanelPassword()">
          ورود
        </button>

        <button
          class="cancel-btn"
          onclick="closePanelLogin()">
          انصراف
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer>
    ساخته شده توسط گروه امازینگ فن 🎮
  </footer>


  <script>

    /* ==================================================
       ⚙️ CONFIGURATION
       فقط اطلاعات این قسمت را تنظیم کن
    ================================================== */

    const SUPABASE_URL =
      "https://deiaynhcldaxbybctphg.supabase.co";

    /*
      🔑 کلید Supabase فعلی خودت را اینجا قرار بده.
      مقدار فعلی فایل قبلی خودت را نگه دار.
    */

    const SUPABASE_KEY =
      "Ysb_publishable_EKRrwk5g0__d8GdCwERvtQ_Qgy1Lh0f";


    /*
      🔐 رمز پنل دقیقاً اینجاست.

      فقط مقدار داخل کوتیشن را با رمز خودت عوض کن.

      مثال:
      const PANEL_PASSWORD = "رمز-خودت";
    */

    const PANEL_PASSWORD =
      "Am!r_Amazing#Panel_7X9@2026";


    /*
      🖥️ آدرس صفحه پنل
      اگر اسم فایل پنل تغییر کرد فقط همین خط را تغییر بده.
    */

    const PANEL_PAGE =
      "panel.html";


    /* ==================================================
       PANEL LOGIN
    ================================================== */

    function openPanelLogin(event) {

      if (event) {
        event.preventDefault();
      }

      const modal =
        document.getElementById("panelLoginModal");

      const input =
        document.getElementById("panelPasswordInput");

      const error =
        document.getElementById("panelLoginError");

      modal.style.display = "flex";

      input.value = "";

      error.style.display = "none";

      setTimeout(() => {
        input.focus();
      }, 100);
    }


    function closePanelLogin() {

      document.getElementById(
        "panelLoginModal"
      ).style.display = "none";
    }


    function checkPanelPassword() {

      const input =
        document.getElementById("panelPasswordInput");

      const error =
        document.getElementById("panelLoginError");


      if (input.value === PANEL_PASSWORD) {

        error.style.display = "none";

        window.location.href = PANEL_PAGE;

      } else {

        error.style.display = "block";

        input.value = "";

        input.focus();
      }
    }


    /* Enter = ورود */
    document
      .getElementById("panelPasswordInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          checkPanelPassword();
        }

        if (event.key === "Escape") {
          closePanelLogin();
        }

      });


    /* کلیک بیرون پنجره = بستن */
    document
      .getElementById("panelLoginModal")
      .addEventListener("click", function(event) {

        if (event.target === this) {
          closePanelLogin();
        }

      });


    /* ==================================================
       NEWS
    ================================================== */

    const newsContainer =
      document.getElementById("newsContainer");


    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function formatDate(dateString) {

      const date =
        new Date(dateString);

      if (isNaN(date.getTime())) {
        return "تاریخ نامشخص";
      }

      return date.toLocaleString(
        "fa-IR",
        {
          year: "numeric",
          month: "long",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );
    }


    async function loadNews() {

      try {

        const response =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/news?select=*&order=created_at.desc",
            {
              method: "GET",

              headers: {
                "apikey": SUPABASE_KEY,
                "Authorization":
                  "Bearer " + SUPABASE_KEY
              }
            }
          );


        if (!response.ok) {
          throw new Error(
            "HTTP " + response.status
          );
        }


        const news =
          await response.json();


        if (!Array.isArray(news) || news.length === 0) {

          newsContainer.innerHTML = `
            <div class="empty">
              📰 هنوز خبری منتشر نشده است.
            </div>
          `;

          return;
        }


        newsContainer.innerHTML =
          news.map(item => {

            return `
              <article class="news-card">

                <h2 class="news-title">
                  ${escapeHTML(item.title)}
                </h2>

                <div class="news-date">
                  🕒 ${formatDate(item.created_at)}
                </div>

                <div class="news-content">
                  ${escapeHTML(item.content)}
                </div>

              </article>
            `;

          }).join("");


      } catch (error) {

        console.error(
          "News loading error:",
          error
        );


        newsContainer.innerHTML = `
          <div class="error">
            ❌ دریافت اخبار با مشکل مواجه شد.
            <br><br>
            لطفاً اتصال اینترنت و تنظیمات Supabase را بررسی کنید.
          </div>
        `;
      }
    }


    /* شروع دریافت اخبار */
    loadNews();

  </script>

</body>
</html>
