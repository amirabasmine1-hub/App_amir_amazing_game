<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCESS TERMINATED</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow:hidden;
    font-family:Tahoma,Arial,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at center,rgba(120,0,255,.16),transparent 45%),
        #030006;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:30px 30px;
}

.box{
    position:relative;
    width:min(100%,700px);
    padding:35px 25px;
    text-align:center;
    border:1px solid rgba(180,80,255,.35);
    border-radius:25px;
    background:rgba(10,3,18,.88);
    box-shadow:
        0 0 30px rgba(120,20,255,.18),
        inset 0 0 35px rgba(120,20,255,.04);
}

.icon{
    font-size:55px;
    margin-bottom:15px;
    animation:pulse 2s infinite;
}

h1{
    font-size:30px;
    color:#d69cff;
    text-shadow:0 0 20px #9b32ff;
    margin-bottom:15px;
}

.status{
    display:inline-block;
    padding:8px 15px;
    border-radius:20px;
    color:#ff7777;
    border:1px solid rgba(255,70,70,.3);
    background:rgba(255,0,0,.07);
    font-size:12px;
    margin-bottom:22px;
}

.message{
    color:#bdb4c7;
    line-height:2;
    font-size:14px;
}

.terminal{
    margin-top:25px;
    padding:18px;
    text-align:left;
    direction:ltr;
    border-radius:15px;
    background:#020204;
    border:1px solid rgba(170,80,255,.18);
    color:#a86cff;
    font-family:monospace;
    font-size:12px;
    line-height:2;
    box-shadow:inset 0 0 20px rgba(100,0,180,.06);
}

.cursor{
    display:inline-block;
    width:7px;
    height:14px;
    margin-left:4px;
    vertical-align:middle;
    background:#b85cff;
    animation:blink .8s infinite;
}

.footer{
    margin-top:22px;
    color:#555;
    font-size:11px;
}

@keyframes blink{
    50%{opacity:0}
}

@keyframes pulse{
    50%{
        transform:scale(1.08);
        filter:drop-shadow(0 0 15px #a238ff);
    }
}

@media(max-width:600px){
    h1{
        font-size:23px;
    }

    .box{
        padding:28px 18px;
    }
}
</style>
</head>

<body>

<div class="box">

    <div class="icon">💀</div>

    <h1>سایت حذف شده است</h1>

    <div class="status">
        ● SYSTEM STATUS: TERMINATED
    </div>

    <div class="message">
        این وب‌سایت دیگر در دسترس نیست.
        <br>
        دسترسی به این سرویس خاتمه یافته است.
    </div>

    <div class="terminal">
        &gt; CONNECTING...<br>
        &gt; SERVER RESPONSE: 410 GONE<br>
        &gt; WEBSITE STATUS: DELETED<br>
        &gt; ACCESS: TERMINATED<span class="cursor"></span>
    </div>

    <div class="footer">
        AMIR_AMAZING_GAME • SYSTEM MESSAGE
    </div>

</div>

</body>
</html>
