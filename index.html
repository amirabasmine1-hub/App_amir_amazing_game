<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8a2be2">

  <title>AMIR_AMAZING_GAME</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #35105f 0%, #090512 45%, #030207 100%);
      color: white;
      overflow-x: hidden;
    }

    header {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #7b2cff;
      background: rgba(5, 3, 12, 0.9);
      box-shadow: 0 0 25px rgba(125, 43, 255, 0.25);
    }

    .logo {
      color: #c477ff;
      font-size: 21px;
      font-weight: bold;
      text-shadow: 0 0 15px #8a2be2;
    }

    main {
      width: min(700px, 92%);
      margin: 70px auto 30px;
      text-align: center;
    }

    .hero {
      padding: 35px 20px;
      border: 1px solid #6d27c9;
      border-radius: 22px;
      background: rgba(15, 8, 28, 0.88);
      box-shadow: 0 0 35px rgba(123, 44, 255, 0.15);
    }

    .hero h1 {
      font-size: 38px;
      color: #d79cff;
      text-shadow: 0 0 20px #8a2be2;
      margin-bottom: 12px;
    }

    .hero p {
      color: #aaa;
      margin-bottom: 30px;
    }

    .buttons {
      display: grid;
      gap: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 1px solid #8a2be2;
      border-radius: 13px;
      background: #160925;
      color: white;
      cursor: pointer;
      font-size: 16px;
      transition: 0.25s;
    }

    button:hover {
      background: #8a2be2;
      box-shadow: 0 0 22px #8a2be2;
      transform: translateY(-2px);
    }

    .terminal {
      margin-top: 25px;
      padding: 18px;
      border: 1px solid #222;
      border-radius: 14px;
      background: #020203;
      direction: ltr;
      text-align: left;
      font-family: monospace;
      color: #00ff9d;
      font-size: 13px;
    }

    .terminal span {
      color: #777;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #666;
      font-size: 13px;
    }

    /* PASSWORD MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-box {
      width: min(420px, 100%);
      padding: 28px;
      border: 1px solid #8a2be2;
      border-radius: 18px;
      background: #0b0612;
      box-shadow: 0 0 40px rgba(138, 43, 226, 0.35);
      text-align: center;
    }

    .modal-box h2 {
      color: #d79cff;
      margin-bottom: 10px;
    }

    .modal-box p {
      color: #999;
      font-size: 13px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #54208d;
      border-radius: 10px;
      outline: none;
      background: #050308;
      color: white;
      font-size: 15px;
      direction: ltr;
      text-align: left;
    }

    input:focus {
      border-color: #b86cff;
      box-shadow: 0 0 12px rgba(184, 108, 255, 0.3);
    }

    .error {
      display: none;
      margin-top: 12px;
      color: #ff4f70;
      font-family: monospace;
      font-size: 13px;
    }

    .cancel {
      border-color: #333;
      color: #aaa;
    }

    .cancel:hover {
      background: #222;
      box-shadow: none;
    }

    /* TOAST */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%) translateY(100px);
      background: #120a1d;
      border: 1px solid #8a2be2;
      color: white;
      padding: 13px 20px;
      border-radius: 12px;
      opacity: 0;
      transition: 0.3s;
      z-index: 2000;
      box-shadow: 0 0 20px rgba(138, 43, 226, 0.25);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 600px) {
      main {
        margin-top: 40px;
      }

      .hero h1 {
        font-size: 28px;
      }

      .logo {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🎮 AMIR_AMAZING_GAME</div>
</header>

<main>

  <section class="hero">

    <h1>AMIR_AMAZING_GAME</h1>

    <p>
      مرکز اصلی سایت 🎮
    </p>

    <div class="buttons">

      <button onclick="goNews()">
        📰 رفتن به صفحه اخبار
      </button>

      <button onclick="goHome()">
        🏠 رفتن به خانه
      </button>

      <button onclick="openPanel()">
        🖥️ پنل مدیریت
      </button>

    </div>

    <div class="terminal">
      <div><span>[SYSTEM]</span> AMIR_AMAZING_GAME</div>
      <div><span>[STATUS]</span> ONLINE</div>
      <div><span>[ACCESS]</span> MANAGEMENT PANEL PROTECTED</div>
      <div><span>[READY]</span> Waiting for command...</div>
    </div>

  </section>

</main>

<footer>
  AMIR_AMAZING_GAME © 2026
</footer>


<!-- PASSWORD MODAL -->

<div class="modal" id="passwordModal">

  <div class="modal-box">

    <h2>🔐 ACCESS CONTROL</h2>

    <p>
      برای ورود به پنل مدیریت رمز عبور را وارد کنید.
    </p>

    <input
      id="passwordInput"
      type="password"
      placeholder="Enter password..."
      autocomplete="off"
      onkeydown="if(event.key === 'Enter') checkPassword()"
    >

    <div class="error" id="errorMessage">
      ERROR 403: ACCESS DENIED
    </div>

    <button onclick="checkPassword()">
      🔓 ورود به پنل
    </button>

    <button class="cancel" onclick="closePanel()">
      ❌ لغو
    </button>

  </div>

</div>


<!-- TOAST -->

<div class="toast" id="toast"></div>


<script>

  // ==============================
  // PANEL PASSWORD
  // ==============================

  const PANEL_PASSWORD = "Am!r_Amazing#Panel_7X9@2026";


  function goNews() {
    window.location.href = "news.html";
  }


  function goHome() {
    window.location.href = "index.html";
  }


  function openPanel() {

    document.getElementById("passwordModal").style.display = "flex";

    document.getElementById("passwordInput").value = "";

    document.getElementById("errorMessage").style.display = "none";

    setTimeout(() => {
      document.getElementById("passwordInput").focus();
    }, 100);

  }


  function closePanel() {

    document.getElementById("passwordModal").style.display = "none";

  }


  function checkPassword() {

    const enteredPassword =
      document.getElementById("passwordInput").value;

    const error =
      document.getElementById("errorMessage");


    if (enteredPassword === PANEL_PASSWORD) {

      showToast("✅ ACCESS GRANTED");

      setTimeout(() => {
        window.location.href = "panel.html";
      }, 500);

    } else {

      error.style.display = "block";

      showToast("❌ رمز عبور اشتباه است");

      document.getElementById("passwordInput").value = "";

      document.getElementById("passwordInput").focus();

    }

  }


  function showToast(message) {

    const toast =
      document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {
      toast.classList.remove("show");
    }, 2200);

  }


  // Close modal by clicking outside

  document.getElementById("passwordModal")
    .addEventListener("click", function(event) {

      if (event.target === this) {
        closePanel();
      }

    });


</script>

</body>
</html>
